server:
  port: 8080

spring:
  application:
    name: weather-backend
  devtools:
    restart:
      enabled: false
  datasource:
    url: jdbc:mysql://localhost:3306/weather_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  springdoc:
    api-docs:
      path: /v3/api-docs

    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: method
      tagsSorter: alpha
      display-request-duration: true

  data:
    redis:
      host: localhost
      port: 6379