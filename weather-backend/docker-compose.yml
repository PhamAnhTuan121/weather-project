version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: weather-mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - weather-network

  redis:
    image: redis:7
    container_name: weather-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - weather-network

  weather-backend:
    build: .

    container_name: weather-backend

    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      OPEN_WEATHER_API_KEY: ${OPEN_WEATHER_API_KEY}

      CURRENT_WEATHER_CRON: ${CURRENT_WEATHER_CRON}
      FORECAST_CRON: ${FORECAST_CRON}
      HISTORY_CRON: ${HISTORY_CRON}

    ports:
      - "8080:8080"

    networks:
      - weather-network

  prometheus:
    image: prom/prometheus:latest

    container_name: weather-prometheus

    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

    depends_on:
      - weather-backend

    networks:
      - weather-network
  grafana:
    image: grafana/grafana:latest

    container_name: weather-grafana

    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - weather-network

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:

networks:
  weather-network:
    driver: bridge